name: Verify the Pages build job (throwaway, never deploys)

# The build job of pages.yml, step for step, minus configure-pages / upload-pages-artifact and the deploy job.
on:
  push:
    branches: ['diag/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Backstop: a wedged browser must fail the run, not hold a runner for hours (one smoke test once ran 2h41m before being cancelled).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assemble the site
        run: bash tools/assemble.sh site

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Smoke test (each page must load its scene)
        env:
          # Playwright's full Chromium in new headless mode. The default chromium-headless-shell build segfaults on index.html
          # and gobbler.html on these runners and leaves the page hanging; see the header of tools/smoke.js.
          SMOKE_BROWSER: chromium
        run: |
          (cd site && python3 -m http.server 8766 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 2
          timeout --kill-after=10 900 node tools/smoke.js http://127.0.0.1:8766 index.html gobbler.html materials.html drillfield.html spec-questions.html two-renderers.html shroud/index.html

      # A browser crash shows up here as a segfault line.
      - name: Kernel log after a failed smoke test
        if: failure()
        continue-on-error: true
        run: sudo dmesg | tail -30

  # Not part of pages.yml. Proves the new smoke.js fails fast (instead of hanging) on the browser that crashes.
  negative-control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash tools/assemble.sh site
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Smoke test on chromium-headless-shell must FAIL, and quickly
        run: |
          (cd site && python3 -m http.server 8766 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 2
          set +e
          start=$(date +%s)
          SMOKE_BROWSER=shell timeout --kill-after=10 900 node tools/smoke.js http://127.0.0.1:8766 index.html gobbler.html materials.html spec-questions.html
          rc=$?
          echo "smoke exit code $rc after $(( $(date +%s) - start )) s"
          sudo dmesg | grep -a segfault | tail -5
          [ "$rc" = 1 ] && [ $(( $(date +%s) - start )) -lt 300 ]
