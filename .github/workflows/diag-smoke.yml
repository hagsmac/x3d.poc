name: Diagnose smoke hang (throwaway)

# Runs only on pushes to diag/** branches. Never deploys. Every step has a hard timeout so nothing can hang silently.
on:
  push:
    branches: ['diag/**']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 1 Machine
        run: |
          echo "nproc: $(nproc)"; free -m; df -h /dev/shm / | cat; uname -a; grep PRETTY /etc/os-release; node --version
          echo "unprivileged userns: $(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo n/a)"

      - name: 2 Assemble the site
        run: bash tools/assemble.sh site

      - name: 3 Install Playwright and Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: 4 Launch Chromium and probe WebGL (default CI flags)
        if: always()
        run: timeout --kill-after=10 120 node tools/diag_webgl.js || echo "probe exit code $?"

      - name: 5 Load index.html, narrated (default CI flags)
        if: always()
        run: |
          (cd site && nohup python3 -m http.server 8766 --bind 127.0.0.1 >/tmp/server.log 2>&1 &)
          sleep 2; curl -s -o /dev/null -w "index.html HTTP %{http_code}\n" http://127.0.0.1:8766/index.html
          (while true; do echo "[res] $(date +%T) $(free -m | awk 'NR==2{print "used="$3"M avail="$7"M"}') load=$(cut -d' ' -f1-3 /proc/loadavg) top: $(ps -eo comm,pcpu --sort=-pcpu | sed -n 2,3p | tr '\n' ' ')"; sleep 5; done) &
          SAMPLER=$!
          timeout --kill-after=10 200 node tools/diag_smoke.js http://127.0.0.1:8766 index.html 150 || echo "diag exit code $?"
          kill $SAMPLER 2>/dev/null || true

      - name: 6 Same page, with --disable-dev-shm-usage --disable-gpu
        if: always()
        run: |
          timeout --kill-after=10 200 node tools/diag_smoke.js http://127.0.0.1:8766 index.html 150 \
            "--no-sandbox,--disable-dev-shm-usage,--disable-gpu,--use-angle=swiftshader,--enable-unsafe-swiftshader,--ignore-gpu-blocklist" || echo "diag exit code $?"

      - name: 7 Same page, with only --no-sandbox
        if: always()
        run: timeout --kill-after=10 200 node tools/diag_smoke.js http://127.0.0.1:8766 index.html 150 "--no-sandbox" || echo "diag exit code $?"

      - name: 8 Kernel messages (OOM kills, crashes)
        if: always()
        run: sudo dmesg 2>/dev/null | tail -25 || echo "dmesg not available"
